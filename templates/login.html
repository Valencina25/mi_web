<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin | Huerto de Juan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages" role="alert" aria-live="polite">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="container" style="max-width: 400px;">
            <div class="producto" style="padding: var(--space-xl);">
                <h1 class="section-title">🔐 Admin</h1>

                <form action="/login" method="POST">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" class="form-input" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: var(--space-md);">Entrar</button>
                </form>

                <p style="text-align: center; margin-top: var(--space-md);">
                    <a href="/" style="color: var(--color-primary);">← Volver a la tienda</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
